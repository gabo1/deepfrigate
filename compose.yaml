name: deepfrigate

services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  # PostgreSQL: one server for everything since 7 sep. Frigate (fork
  # PostgreSQL+pgvector, repo frigate-pg) owns schema `public`; our tables
  # (events, frigate_event_links, camera_transitions) live in schema
  # `deepfrigate` of the same database, role `deepfrigate` with
  # search_path=deepfrigate,public. The server runs in the frigate-pg compose
  # project (container frigate-pgvector-smoke-db, alias pgvector-smoke-db, on
  # network deepfrigate_default).
  minio:
    # Deprecated with recording-sync. Not started unless --profile deprecated.
    profiles: ["deprecated"]
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-deepfrigate}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6343}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6344}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  triton:
    image: ${TRITON_IMAGE:?Set TRITON_IMAGE in .env}
    restart: unless-stopped
    gpus: all
    ipc: host
    # CUDA IPC handles (nvinferserver enable_cuda_buffer_sharing) only resolve
    # inside one PID namespace; share the host's with video-engine.
    pid: host
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=object-detector
      - --load-model=vehicle-embedding
      - --load-model=person-attribute
      - --load-model=vehicle-attribute
      - --strict-model-config=true
    ports:
      - "127.0.0.1:${TRITON_HTTP_PORT:-8010}:8000"
      - "127.0.0.1:${TRITON_GRPC_PORT:-8011}:8001"
      - "127.0.0.1:${TRITON_METRICS_PORT:-8012}:8002"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  platform-api:
    build: ./services/platform-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deepfrigate}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${POSTGRES_HOST:-pgvector-smoke-db}:5432/${POSTGRES_DB:-frigate_pgvector_smoke}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vehicle_embeddings}
      FRIGATE_API_URL: ${FRIGATE_API_URL:-http://frigate-pgvector-smoke:5000/api}
      FRIGATE_EVENT_STORE_URL: ${FRIGATE_EVENT_STORE_URL:-postgresql://frigate_pgvector:${FRIGATE_PG_PASSWORD:-frigate_pgvector_smoke}@${POSTGRES_HOST:-pgvector-smoke-db}:5432/${POSTGRES_DB:-frigate_pgvector_smoke}}
      PIPELINE_CONFIG: /app/pipeline-config/pipeline.yaml
      PIPELINE_SCHEMA: /app/contracts/pipeline.schema.json
      ZONES_CONFIG: /app/config/zones.json
      TRITON_MODEL_REPOSITORY: /app/models
      TRITON_HTTP_URL: http://triton:8000
      TRITON_REQUIRED_MODELS: ${TRITON_REQUIRED_MODELS:-object-detector,vehicle-embedding,person-attribute,vehicle-attribute}
      MODEL_MANAGEMENT_ALLOW_UNLOAD: ${MODEL_MANAGEMENT_ALLOW_UNLOAD:-false}
    volumes:
      - ./services/video-engine/config:/app/pipeline-config
      - ./contracts/pipeline.schema.json:/app/contracts/pipeline.schema.json:ro
      - ./config/zones.json:/app/config/zones.json:ro
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-8082}:8080"
    depends_on:
      qdrant:
        condition: service_started
      triton:
        condition: service_healthy

  ai-router:
    build:
      context: .
      dockerfile: services/ai-router/Dockerfile
    restart: unless-stopped
    ipc: host
    environment:
      MQTT_HOST: mqtt
      TRITON_URL: triton:8001
      TRITON_MODEL: ${TRITON_MODEL:-vehicle-embedding}
      FRAME_STORE_URL: http://frame-store:8080
      FRAME_REF_WORKERS: ${FRAME_REF_WORKERS:-4}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vehicle_embeddings}
      EMBEDDING_LABELS: ${EMBEDDING_LABELS:-person,car}
      EMBEDDING_MAX_PER_TRACK: ${EMBEDDING_MAX_PER_TRACK:-3}
      EMBEDDING_MIN_CROP_WIDTH: ${EMBEDDING_MIN_CROP_WIDTH:-48}
      EMBEDDING_MIN_CROP_HEIGHT: ${EMBEDDING_MIN_CROP_HEIGHT:-32}
      DS_SNAPSHOT_DIR: /opt/ds-snapshots
      ATTRIBUTE_LABELS: ${ATTRIBUTE_LABELS:-person,car}
      ATTRIBUTE_TRITON_MODEL: ${ATTRIBUTE_TRITON_MODEL:-person-attribute}
      VEHICLE_ATTRIBUTE_TRITON_MODEL: ${VEHICLE_ATTRIBUTE_TRITON_MODEL:-vehicle-attribute}
      ATTRIBUTE_MAX_PER_TRACK: ${ATTRIBUTE_MAX_PER_TRACK:-2}
      ATTRIBUTE_MIN_CROP_WIDTH: ${ATTRIBUTE_MIN_CROP_WIDTH:-64}
      ATTRIBUTE_MIN_CROP_HEIGHT: ${ATTRIBUTE_MIN_CROP_HEIGHT:-96}
      VEHICLE_ATTRIBUTE_MIN_CROP_WIDTH: ${VEHICLE_ATTRIBUTE_MIN_CROP_WIDTH:-80}
      VEHICLE_ATTRIBUTE_MIN_CROP_HEIGHT: ${VEHICLE_ATTRIBUTE_MIN_CROP_HEIGHT:-48}
      # Car crops: "openalpr" = alpr-worker (color, make, model, body type,
      # year + plate); "pulc" = the previous Triton head (kept, disabled).
      VEHICLE_ATTRIBUTE_PROVIDER: ${VEHICLE_ATTRIBUTE_PROVIDER:-openalpr}
      OPENALPR_URL: http://alpr-worker:8080
      OPENALPR_MIN_ATTRIBUTE_SCORE: ${OPENALPR_MIN_ATTRIBUTE_SCORE:-0.3}
      OPENALPR_TIMEOUT_SECONDS: ${OPENALPR_TIMEOUT_SECONDS:-5}
      PLATE_MIN_CONFIDENCE: ${PLATE_MIN_CONFIDENCE:-80}
      PLATE_VOTE_MIN_CONFIDENCE: ${PLATE_VOTE_MIN_CONFIDENCE:-50}
      PLATE_MIN_VOTES: ${PLATE_MIN_VOTES:-2}
      PLATE_STOP_VOTES: ${PLATE_STOP_VOTES:-3}
      PLATE_MIN_CROP_WIDTH: ${PLATE_MIN_CROP_WIDTH:-120}
      PLATE_MAX_ATTEMPTS: ${PLATE_MAX_ATTEMPTS:-6}
      PLATE_SAMPLE_SECONDS: ${PLATE_SAMPLE_SECONDS:-1.0}
    volumes:
      - ./data/ds-snapshots:/opt/ds-snapshots:ro
    depends_on:
      - mqtt
      - triton
      - frame-store
      - qdrant
      - alpr-worker

  # OpenALPR SDK as a service. ai-router sends the same car crop it already
  # has (FrameRef) and gets plate + vehicle make/model/color back. Needs
  # config/openalpr/license.conf (trial key, git-ignored). CPU only.
  alpr-worker:
    build:
      context: .
      dockerfile: services/alpr-worker/Dockerfile
      args:
        OPENALPR_SDK_IMAGE: ${OPENALPR_SDK_IMAGE:-openalpr/agent:4.1.13-sdk}
    restart: unless-stopped
    environment:
      ALPR_COUNTRY: ${ALPR_COUNTRY:-mx}
      ALPR_TOP_N: ${ALPR_TOP_N:-5}
    volumes:
      - ./config/openalpr/license.conf:/etc/openalpr/license.conf:ro

  frame-store:
    build:
      context: .
      dockerfile: services/frame-store/Dockerfile
    restart: unless-stopped
    ipc: host
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TRACKED_OBJECTS_TOPIC: deepfrigate/tracked-objects/+
      FRAME_REF_SCHEMA: /app/contracts/frame-ref.schema.json
      FRAME_SHM_ROOT: /dev/shm
      FRAME_SWEEP_SECONDS: ${FRAME_SWEEP_SECONDS:-1}
    ports:
      - "127.0.0.1:${FRAME_STORE_PORT:-8083}:8080"
    depends_on:
      - mqtt

  detection-adapter:
    build:
      context: .
      dockerfile: services/detection-adapter/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DETECTIONS_TOPIC_PREFIX: deepfrigate/detections
      DETECTIONS_TOPIC: deepfrigate/detections/#
      TRACKED_OBJECTS_TOPIC: deepfrigate/tracked-objects/{camera_id}
      LOST_AFTER_SECONDS: ${LOST_AFTER_SECONDS:-5}
      END_AFTER_SECONDS: ${END_AFTER_SECONDS:-5}
      DETECT_FPS: ${DETECT_FPS:-5}
      OBJECT_THRESHOLD: ${OBJECT_THRESHOLD:-0.7}
      # Zones/lines/directions: drawn in Frigate's UI, read from /api/config,
      # reloaded when Frigate announces itself on MQTT (no polling).
      ZONES_SOURCE: ${ZONES_SOURCE:-frigate}
      FRIGATE_API_URL: ${FRIGATE_API_URL:-http://frigate-pgvector-smoke:5000/api}
      ZONES_RELOAD_TOPIC: deepfrigate/zones/reload
      # DeepStream frame the detections are expressed in (mux size).
      ZONES_FRAME_WIDTH: ${ZONES_FRAME_WIDTH:-1280}
      ZONES_FRAME_HEIGHT: ${ZONES_FRAME_HEIGHT:-720}
      # Legacy file source (ZONES_SOURCE=file).
      ZONES_CONFIG: /app/config/zones.json
      ZONE_DWELL_UPDATE_SECONDS: ${ZONE_DWELL_UPDATE_SECONDS:-1}
      # Antiparpadeo del overcrowding. Los valores por zona en zones.json
      # (overcrowding_clear_threshold / overcrowding_inertia) mandan sobre estos.
      OVERCROWDING_CLEAR_MARGIN: ${OVERCROWDING_CLEAR_MARGIN:-2}
      OVERCROWDING_HOLD_SECONDS: ${OVERCROWDING_HOLD_SECONDS:-10}
      MIN_DETECTION_CONFIDENCE: ${MIN_DETECTION_CONFIDENCE:-0.5}
      MIN_DETECTION_AREA: ${MIN_DETECTION_AREA:-0}
      METRICS_PORT: ${METRICS_PORT:-9110}
      METRICS_REFRESH_SECONDS: ${METRICS_REFRESH_SECONDS:-1}
      # One useless series per counter otherwise; nothing queries them.
      PROMETHEUS_DISABLE_CREATED_SERIES: "true"
    # Prometheus lives on observabilidad_default and scrapes via
    # host.docker.internal, like the 9108/9109 jobs it replaces.
    ports:
      - "${METRICS_PORT:-9110}:${METRICS_PORT:-9110}"
    volumes:
      - ./config/zones.json:/app/config/zones.json:ro
    depends_on:
      - mqtt

  # Alternative A (tag alpr-agent-v1): Rekor Scout agent decodes `user` on its
  # own and POSTs plate groups to alpr-bridge, which matches them to DeepStream
  # tracks. Superseded by alpr-worker (same crop, no second decode); kept under
  # `--profile alpr-agent` for comparison. Same license file.
  openalpr:
    image: ${OPENALPR_IMAGE:-openalpr/agent:raccoon-nocuda-runtime}
    profiles: ["alpr-agent"]
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    volumes:
      - ./config/openalpr/license.conf:/etc/openalpr/license.conf:ro
      - ./config/openalpr/alprd.conf:/etc/openalpr/alprd.conf:ro
      - ./config/openalpr/stream.d:/etc/openalpr/stream.d:ro
      - openalpr-data:/var/lib/openalpr
    depends_on:
      - alpr-bridge

  alpr-bridge:
    build:
      context: .
      dockerfile: services/alpr-bridge/Dockerfile
    profiles: ["alpr-agent"]
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TRACKED_OBJECTS_TOPIC: deepfrigate/tracked-objects/{camera_id}
      # agent camera_id -> DeepFrigate camera id
      ALPR_CAMERAS: ${ALPR_CAMERAS:-1:user}
      ALPR_MIN_CONFIDENCE: ${ALPR_MIN_CONFIDENCE:-50}
      ALPR_MATCH_WINDOW_SECONDS: ${ALPR_MATCH_WINDOW_SECONDS:-3}
    depends_on:
      - mqtt

  event-engine:
    build:
      context: .
      dockerfile: services/event-engine/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deepfrigate}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${POSTGRES_HOST:-pgvector-smoke-db}:5432/${POSTGRES_DB:-frigate_pgvector_smoke}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TRACKED_OBJECTS_TOPIC: deepfrigate/tracked-objects/+
      EVENTS_TOPIC: deepfrigate/events/{camera_id}
      EVENT_QUEUE_SIZE: ${EVENT_QUEUE_SIZE:-1024}
      # HTTP calls to Frigate consume this separate queue; MQTT persistence
      # never waits for a slow Frigate API.
      FRIGATE_BRIDGE_QUEUE_SIZE: ${FRIGATE_BRIDGE_QUEUE_SIZE:-8192}
      FRIGATE_BRIDGE_UPDATE_SECONDS: ${FRIGATE_BRIDGE_UPDATE_SECONDS:-1}
      FRIGATE_REVIEW_BRIDGE: ${FRIGATE_REVIEW_BRIDGE:-true}
      FRIGATE_REVIEW_LABELS: ${FRIGATE_REVIEW_LABELS:-person,car}
      FRIGATE_API_URL: ${FRIGATE_API_URL:-http://frigate-pgvector-smoke:5000/api}
      FRIGATE_API_TIMEOUT_SECONDS: ${FRIGATE_API_TIMEOUT_SECONDS:-5}
      # Leave empty when the bridge targets a PostgreSQL-backed Frigate; its
      # legacy SQLite geometry store cannot update that instance.
      # Empty: the bridge writes Frigate PostgreSQL directly (store URL above).
      FRIGATE_DB_PATH: ${FRIGATE_DB_PATH-}
      # PostgreSQL URL for the Frigate Event/Timeline store. Takes precedence
      # over FRIGATE_DB_PATH when the bridge targets PostgreSQL-backed Frigate.
      FRIGATE_EVENT_STORE_URL: ${FRIGATE_EVENT_STORE_URL:-postgresql://frigate_pgvector:${FRIGATE_PG_PASSWORD:-frigate_pgvector_smoke}@${POSTGRES_HOST:-pgvector-smoke-db}:5432/${POSTGRES_DB:-frigate_pgvector_smoke}}
      ZONES_CONFIG: /app/config/zones.json
      DS_SNAPSHOT_DIR: /opt/ds-snapshots
      FRIGATE_CLIPS_DIR: /media/frigate/clips
      # Cross-camera transitions from PP-ShiTu embeddings: undirected camera
      # pairs "a:b,c:d" (empty disables), lookback window and cosine floor.
      TRANSITION_PAIRS: ${TRANSITION_PAIRS:-c4aac4f4eefe:c4aac4f4ef0a}
      # cooccurrence: time + optional direction, embedding only breaks ties.
      # embedding: pure re-id lookup (needs a model that separates identities).
      TRANSITION_MODE: ${TRANSITION_MODE:-cooccurrence}
      TRANSITION_WINDOW_SECONDS: ${TRANSITION_WINDOW_SECONDS:-60}
      TRANSITION_MIN_SCORE: ${TRANSITION_MIN_SCORE:-0.3}
      TRANSITION_DIRECTION: ${TRANSITION_DIRECTION:-ignore}
      TRANSITION_EMBED_WAIT_SECONDS: ${TRANSITION_EMBED_WAIT_SECONDS:-6}
      # B may start up to this long before A was last seen; and a track must
      # have moved (position_changes>0 or >= MIN_MOVE of the width in x).
      TRANSITION_OVERLAP_SECONDS: ${TRANSITION_OVERLAP_SECONDS:-15}
      TRANSITION_MIN_MOVE: ${TRANSITION_MIN_MOVE:-0.1}
      TRANSITION_LABELS: ${TRANSITION_LABELS:-car,person}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vehicle_embeddings}
    volumes:
      - ./config/frigate:/frigate
      - ./config/zones.json:/app/config/zones.json:ro
      - ./data/ds-snapshots:/opt/ds-snapshots:ro
      - frigate-bridge-media:/media/frigate
    depends_on:
      mqtt:
        condition: service_started
      frigate:
        condition: service_healthy

  recording-sync:
    # Deprecated 1 Sep 2026. Do not deploy. Kept for reference only.
    profiles: ["deprecated"]
    build:
      context: .
      dockerfile: services/recording-sync/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deepfrigate}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${POSTGRES_HOST:-pgvector-smoke-db}:5432/${POSTGRES_DB:-frigate_pgvector_smoke}
      SITE_ID: ${SITE_ID:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-deepfrigate}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-deepfrigate}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      FRIGATE_DB_PATH: /frigate/frigate.db
      FRIGATE_MEDIA_DIR: /media/frigate
      RECORDING_POLL_SECONDS: ${RECORDING_POLL_SECONDS:-10}
      RECORDING_BATCH_SIZE: ${RECORDING_BATCH_SIZE:-20}
    volumes:
      - ./config/frigate:/frigate:ro
      - frigate-media:/media/frigate:ro
    depends_on:
      minio:
        condition: service_healthy
      frigate:
        condition: service_healthy

  frigate:
    build:
      context: .
      dockerfile: services/frigate/Dockerfile
      args:
        FRIGATE_IMAGE: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.18.0-beta3-tensorrt}
    image: deepfrigate-frigate:local
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    gpus: all
    environment:
      FRIGATE_CAMERA_TIENDA_URL: ${RTSP_TIENDA:?Set RTSP_TIENDA in .env}
      FRIGATE_CAMERA_TRAFICO_URL: ${RTSP_TRAFICO:?Set RTSP_TRAFICO in .env}
    volumes:
      - ./config/frigate:/config
      - frigate-media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "${WEB_PORT:-3002}:8971"
      - "127.0.0.1:${GO2RTC_API_PORT:-1984}:1984"
      - "127.0.0.1:${FRIGATE_RTSP_PORT:-8554}:8554"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5000/api/version"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      mqtt:
        condition: service_started
      platform-api:
        condition: service_started

  frigate-web-dev:
    image: node:20-bookworm-slim
    profiles: ["web-dev"]
    working_dir: /work
    environment:
      UPSTREAM: /upstream
      PATCHES: /patches
      WEB_DEV: /work
      PROXY_HOST: frigate:8971
      WEB_DEV_PORT: "5173"
      DEEPFRIGATE_WEB_SRC: /patches/web
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    volumes:
      - ./frigate/web:/upstream:ro
      - ./services/frigate:/patches:ro
      - ./scripts/dev-frontend.sh:/scripts/dev-frontend.sh:ro
      - web-dev-work:/work
    depends_on:
      frigate:
        condition: service_healthy
    command: ["bash", "/scripts/dev-frontend.sh"]

  video-engine:
    build:
      context: .
      dockerfile: services/video-engine/Dockerfile
      args:
        DEEPSTREAM_IMAGE: ${DEEPSTREAM_IMAGE:?Set DEEPSTREAM_IMAGE in .env}
    profiles: ["video"]
    gpus: all
    ipc: host
    pid: host  # see triton: CUDA buffer sharing needs one PID namespace
    # The stall watchdog exits the process when no buffers arrive for
    # FRAME_STALL_RESTART_SECONDS; this policy brings the pipeline back.
    restart: unless-stopped
    depends_on:
      triton:
        condition: service_healthy
      frame-store:
        condition: service_healthy
      frigate:
        condition: service_healthy
    environment:
      RTSP_TIENDA: ${RTSP_TIENDA:-rtsp://frigate:8554/tienda}
      RTSP_USER: ${RTSP_USER:-rtsp://100.83.231.97:8554/user}
      RTSP_C4AAC4F4EEFE: ${RTSP_C4AAC4F4EEFE:-rtsp://100.83.231.97:8554/c4aac4f4eefe}
      RTSP_C4AAC4F4EF0A: ${RTSP_C4AAC4F4EF0A:-rtsp://100.83.231.97:8554/c4aac4f4ef0a}
      PIPELINE_CONFIG: /opt/deepfrigate/config/pipeline.yaml
      PIPELINE_SCHEMA: /opt/contracts/pipeline.schema.json
      ZONES_CONFIG: /opt/config/zones.json
      TRITON_MODEL_REPOSITORY: /opt/models
      TRITON_GRPC_URL: triton:8001
      FRAME_STORE_URL: http://frame-store:8080
      FRAME_TTL_SECONDS: ${FRAME_TTL_SECONDS:-15}
      FRAME_REFRESH_SECONDS: ${FRAME_REFRESH_SECONDS:-5}
      FRAME_MIN_EXPORT_SECONDS: ${FRAME_MIN_EXPORT_SECONDS:-1}
      FRAME_CONFIDENCE_IMPROVEMENT: ${FRAME_CONFIDENCE_IMPROVEMENT:-0.05}
      FRAME_CROP_PADDING: ${FRAME_CROP_PADDING:-0.1}
      DS_SNAPSHOT_DIR: /opt/snapshots
      DS_SNAPSHOT_INTERVAL: ${DS_SNAPSHOT_INTERVAL:-0.4}
      # Exit (and restart) when the GStreamer graph stops delivering buffers
      # for this long. 0 disables. A camera outage on every source also
      # trips it; the restart is cheap and the log says why.
      FRAME_STALL_RESTART_SECONDS: ${FRAME_STALL_RESTART_SECONDS:-120}
      # Delete DeepStream snapshot files (flat + bundles) older than this.
      # Frigate keeps its own copies; nothing reads these after END. 0 disables.
      DS_SNAPSHOT_RETENTION_HOURS: ${DS_SNAPSHOT_RETENTION_HOURS:-24}
    volumes:
      - ./services/video-engine:/opt/deepfrigate:ro
      - ./data/ds-snapshots:/opt/snapshots
      - ./contracts:/opt/contracts:ro
      - ./config/zones.json:/opt/config/zones.json:ro
      - ./models:/opt/models:ro

volumes:
  openalpr-data:
  frigate-bridge-media:
    name: ${FRIGATE_BRIDGE_MEDIA_VOLUME:-frigate-pg_pgvector-smoke-media}
    external: true
  mqtt-data:
  qdrant-data:
  frigate-media:
  minio-data:
  web-dev-work:
