; Rekor Scout / OpenALPR agent for DeepFrigate. Overrides
; /usr/share/openalpr/config/alprd.defaults.conf. The license lives in
; config/openalpr/license.conf (git-ignored), mounted at /etc/openalpr/license.conf.
[daemon]
country = mx
hardware_acceleration = 0
analysis_threads = 1
motion_detection = 1
vehicle_tracking_enabled = 1
; No local plate images: Frigate already keeps the event snapshot.
store_plates = 0
; Results go to our bridge, which maps them onto DeepStream tracks.
upload_data = 1
upload_address = http://alpr-bridge:8080/rekor
websockets_enabled = 0
