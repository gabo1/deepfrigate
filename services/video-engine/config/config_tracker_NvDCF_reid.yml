# DeepFrigate: NvDCF "perf" + re-asociación por apariencia (ReID) y salida del
# vector ReID en cada objeto (outputReidTensor) para re-identificar entre
# cámaras. Base: config_tracker_NvDCF_perf.yml de DeepStream 9; el bloque
# TargetManagement gana los parámetros de re-asociación del perfil accuracy y
# se añade la sección ReID con ReIdentificationNet (NVIDIA TAO, Market-1501,
# 256-d). Modelo y engine en /opt/models/tracker-reid (montaje RW; el engine
# se genera la primera vez, ~2 min). Ver docs/OPERACION.md §6d.
%YAML:1.0
